<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Soundlab Tracks</title>
    <meta name="description" content="Drum &amp; bass written in Strudel, from atmospheric rollers to bangers. Pick a track or upload your own." />
    <link rel="stylesheet" href="css/player.css" />
  </head>
  <body>
    <main class="app" data-role="app">
      <header class="top">
        <h1>Vibe Soundlab <span>Tracks</span></h1>
        <p>Drum &amp; bass written in <a href="https://strudel.cc/" target="_blank" rel="noopener">Strudel</a>, from atmospheric rollers to bangers. Pick a track, or upload your own Strudel file.</p>
      </header>

      <section class="library" aria-label="Tracks">
        <ul class="tracks" data-role="list"></ul>
        <label class="drop" data-role="drop">
          <input type="file" accept=".js,.mjs,.txt,.strudel" multiple data-role="file" />
          <span><strong>Upload a track</strong> or drop Strudel files here</span>
          <small>Uploads stay in this browser.</small>
        </label>
      </section>

      <section class="now" aria-label="Now playing">
        <div class="now-head">
          <div>
            <h2 data-role="title">No track</h2>
            <p class="details" data-role="details"></p>
          </div>
          <div class="transport">
            <button type="button" class="ghost" data-role="prev" aria-label="Previous track">‹</button>
            <button type="button" class="play" data-role="play" aria-pressed="false" disabled>Play</button>
            <button type="button" class="ghost" data-role="next" aria-label="Next track">›</button>
            <button type="button" class="repeat" data-role="repeat" data-mode="off" aria-pressed="false" title="Off: stop after the last track · All: start over · One: repeat this track">Repeat off</button>
          </div>
        </div>
        <p class="about" data-role="about"></p>
        <div class="seek">
          <input type="range" class="seekbar" data-role="seek" min="0" max="1" step="1" value="0" aria-label="Position in bars" disabled />
          <ol class="sections" data-role="sections" aria-label="Parts of the track"></ol>
          <p class="clock">
            <span data-role="time">0:00</span>
            <span class="where"><span class="progress" data-role="progress"></span> <span class="section-name" data-role="section"></span></span>
            <span data-role="length"></span>
          </p>
        </div>
        <p class="status" aria-live="polite"><span data-role="status"></span></p>
        <details class="source">
          <summary>Code <a data-role="open" href="https://strudel.cc/" target="_blank" rel="noopener">Open in strudel.cc</a></summary>
          <pre><code data-role="code"></code></pre>
        </details>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
