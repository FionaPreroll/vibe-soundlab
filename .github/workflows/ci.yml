# Soundlab branch: tests only. This branch is never deployed to GitHub Pages;
# only `main` (the track player) publishes to gh-pages.
name: CI (soundlab)

on:
  push:
    branches: [soundlab]
  pull_request:
    branches: [soundlab]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # installs the pnpm version pinned in package.json ("packageManager")
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # the tests, with a coverage report of js/ in lcov.info
      - run: pnpm run coverage
      # needs the CODECOV_TOKEN repository secret; a failed upload does not fail CI
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
